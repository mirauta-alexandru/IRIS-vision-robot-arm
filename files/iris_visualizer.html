                </span>
              )}
            </div>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              {visionEnabled && (
                <>
                  <button onClick={()=>setVisionTestMode(t=>!t)} style={{
                    background:visionTestMode?"#f59e0b":"#10b981",
                    border:"none",color:"#080c14",borderRadius:6,
                    padding:"5px 12px",fontSize:10,cursor:"pointer",
                    fontFamily:"Outfit",fontWeight:700
                  }}>
                    {visionTestMode ? "⚡ TEST" : "● LIVE"}
                  </button>
                  <div style={{display:"flex",alignItems:"center",gap:3}}>
                    <span style={{fontSize:9,color:"#3b5068"}}>Z</span>
                    <button onClick={()=>setVisionPickZ(z=>Math.max(10,z-10))} style={{
                      background:"#1b2838",border:"none",color:"#c8d6e5",borderRadius:4,
                      width:22,height:22,fontSize:13,cursor:"pointer",fontFamily:"IBM Plex Mono"
                    }}>−</button>
                    <span style={{fontSize:12,color:"#c8d6e5",fontWeight:600,width:32,textAlign:"center"}}>{visionPickZ}</span>
                    <button onClick={()=>setVisionPickZ(z=>z+10)} style={{
                      background:"#1b2838",border:"none",color:"#c8d6e5",borderRadius:4,
                      width:22,height:22,fontSize:13,cursor:"pointer",fontFamily:"IBM Plex Mono"
                    }}>+</button>
                  </div>
                </>
              )}
              <button onClick={visionEnabled ? stopCamera : startCamera}
                disabled={!connected}
                style={{
                  background:visionEnabled?"#164e63":"linear-gradient(135deg,#06b6d4,#0891b2)",
                  border:"none",color:visionEnabled?"#06b6d4":"#080c14",borderRadius:8,
                  padding:"5px 14px",fontSize:10,cursor:connected?"pointer":"not-allowed",
                  fontFamily:"Outfit",fontWeight:700,letterSpacing:0.5
                }}>
                {visionEnabled ? "■ STOP" : "▶ CAMERA"}
              </button>
            </div>
          </div>

          {visionEnabled ? (
            <div style={{position:"relative"}}>
              <div style={{position:"relative",cursor:"crosshair",background:"#000"}} onClick={handleVisionClick}>
                <img src={BRIDGE_URL + "/video_feed"}
                  style={{width:"100%",display:"block"}}
                  alt="Camera feed"/>
                
                {/* Click crosshair overlay */}
                {visionLastClick && (
                  <svg style={{position:"absolute",top:0,left:0,width:"100%",height:"100%",pointerEvents:"none"}}>
                    <circle cx={visionLastClick.screenX} cy={visionLastClick.screenY} r={16}
                      fill="none" stroke="#fbbf24" strokeWidth={2} strokeDasharray="4,3"/>
                    <line x1={visionLastClick.screenX-22} y1={visionLastClick.screenY}
                      x2={visionLastClick.screenX+22} y2={visionLastClick.screenY}
                      stroke="#fbbf24" strokeWidth={1}/>
                    <line x1={visionLastClick.screenX} y1={visionLastClick.screenY-22}
                      x2={visionLastClick.screenX} y2={visionLastClick.screenY+22}
                      stroke="#fbbf24" strokeWidth={1}/>
                  </svg>
                )}
              </div>
              
              {/* Vision log bar */}
              {visionLog.length > 0 && (
                <div style={{padding:"6px 12px",background:"#111927",maxHeight:80,overflowY:"auto",borderTop:"1px solid #1b2838"}}>
                  {visionLog.slice(-4).map((log, i) => (
                    <div key={i} style={{fontSize:10,color:"#3b5068",fontFamily:"IBM Plex Mono",lineHeight:1.7,display:"flex",justifyContent:"space-between"}}>
                      <span>
                        <span style={{color:log.test?"#f59e0b":"#06b6d4",fontWeight:700}}>{log.test?"T":"●"}</span>
                        {" "}px({log.px},{log.py})
                        {log.robot && <span style={{color:"#c8d6e5"}}> → ({log.robot.x}, {log.robot.y}, {log.robot.z})</span>}
                      </span>
                      <span style={{color:log.ok?(log.error_mm<5?"#10b981":"#f59e0b"):"#ef4444",fontWeight:600}}>
                        {log.ok ? log.error_mm?.toFixed(1)+"mm" : log.err_msg || "ERR"}
                      </span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          ) : (
            <div style={{padding:"30px 16px",textAlign:"center"}}>
              {connected ? (
                <div>
                  <div style={{fontSize:11,color:"#3b5068",marginBottom:6}}>Click ▶ CAMERA to start vision pick</div>
                  {!visionCalib?.loaded && (
                    <div style={{fontSize:10,color:"#f59e0b"}}>⚠ Run iris_vision_v3.py to calibrate first</div>
                  )}
                </div>
              ) : (
                <div style={{fontSize:11,color:"#2a3f55"}}>Bridge required for vision</div>
              )}
            </div>
          )}
        </div>

        {/* ─── GEMINI ROBOTICS ER PANEL ─── */}
        <div style={{background:"#0d1117",borderRadius:16,border:"1px solid #1b2838",overflow:"hidden",marginTop:12}}>
          <div style={{padding:"10px 16px",borderBottom:"1px solid #1b2838",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontFamily:"Outfit",fontSize:16,fontWeight:800,color:"#a855f7",letterSpacing:2}}>GEMINI ER</span>
              <span style={{fontSize:9,color:"#3b5068"}}>Robotics 1.6</span>
            </div>
            <button onClick={()=>setGeminiAutoMove(a=>!a)} style={{
              background:geminiAutoMove?"#10b981":"#1b2838",
              border:"none",color:geminiAutoMove?"#080c14":"#3b5068",borderRadius:6,
              padding:"4px 10px",fontSize:10,cursor:"pointer",
              fontFamily:"Outfit",fontWeight:700
            }}>
              {geminiAutoMove ? "● AUTO MOVE" : "○ DETECT ONLY"}
            </button>
          </div>

          <div style={{padding:"12px 16px"}}>
            {/* Prompt input */}
            <div style={{display:"flex",gap:8}}>
              <input type="text" value={geminiPrompt}
                onChange={e => setGeminiPrompt(e.target.value)}
                onKeyDown={e => { if(e.key === "Enter") sendGemini(); }}
                placeholder="e.g. find the red pen..."
                disabled={!visionEnabled}
                style={{
                  flex:1,background:"#111927",border:"1px solid #1b2838",color:"#c8d6e5",
                  borderRadius:8,padding:"8px 12px",fontSize:12,fontFamily:"IBM Plex Mono",
                  outline:"none"
                }}/>
              <button onClick={sendGemini}
                disabled={!visionEnabled || geminiLoading || !geminiPrompt.trim()}
                style={{
                  background:geminiLoading?"#1b2838":"linear-gradient(135deg,#a855f7,#7c3aed)",
                  border:"none",color:geminiLoading?"#3b5068":"#fff",borderRadius:8,
                  padding:"8px 16px",fontSize:11,cursor:visionEnabled?"pointer":"not-allowed",
                  fontFamily:"Outfit",fontWeight:700,letterSpacing:0.5,minWidth:60
                }}>
                {geminiLoading ? "..." : "ASK"}
              </button>
            </div>

            {!visionEnabled && (
              <div style={{fontSize:10,color:"#f59e0b",marginTop:6}}>Start camera first</div>
            )}

            {/* Detected objects */}
            {geminiObjects.length > 0 && (
              <div style={{marginTop:10}}>
                <div style={{fontSize:10,color:"#a855f7",fontWeight:700,marginBottom:6}}>
                  DETECTED ({geminiObjects.length})
                </div>
                <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                  {geminiObjects.map((obj, i) => (
                    <button key={i} onClick={() => moveToGeminiObject(obj)}
                      style={{
                        background:"#111927",border:"1px solid #a855f7",color:"#c8d6e5",
                        borderRadius:8,padding:"6px 12px",fontSize:11,cursor:"pointer",
                        fontFamily:"IBM Plex Mono",transition:"all 0.2s",
                        display:"flex",flexDirection:"column",alignItems:"flex-start",gap:2
                      }}
                      onMouseEnter={e=>{e.currentTarget.style.background="#a855f7";e.currentTarget.style.color="#080c14"}}
                      onMouseLeave={e=>{e.currentTarget.style.background="#111927";e.currentTarget.style.color="#c8d6e5"}}
                    >
                      <span style={{fontWeight:700}}>{obj.label}</span>
                      <span style={{fontSize:9,opacity:0.7}}>
                        ({obj.robot.x}, {obj.robot.y})mm
                      </span>
                    </button>
                  ))}
                </div>
              </div>
            )}

            {/* Raw response */}
            {geminiRaw && !geminiObjects.length && (
              <div style={{marginTop:8,background:"#111927",borderRadius:8,padding:8,fontSize:10,
                color:"#3b5068",fontFamily:"IBM Plex Mono",maxHeight:60,overflowY:"auto",whiteSpace:"pre-wrap"}}>
                {geminiRaw}
              </div>
            )}
          </div>
        </div>

        {/* ─── IRIS AGENT PANEL (Voice Chat) ─── */}
        <div style={{background:"#0d1117",borderRadius:16,border:`1px solid ${agentLoading?"#f97316":"#1b2838"}`,overflow:"hidden",marginTop:12,transition:"border-color 0.3s"}}>
          <div style={{padding:"10px 16px",borderBottom:"1px solid #1b2838",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontFamily:"Outfit",fontSize:16,fontWeight:800,color:"#f97316",letterSpacing:2}}>IRIS AGENT</span>
              <span style={{fontSize:9,color:agentLoading?"#f97316":"#3b5068",fontWeight:agentLoading?700:400}}>
                {agentLoading ? "● THINKING..." : "voice + chat"}
              </span>
            </div>
            <div style={{display:"flex",gap:4,alignItems:"center"}}>
              {/* TTS Toggle */}
              {ttsSupported && (
                <button onClick={()=>{setTtsEnabled(t=>!t); if(ttsEnabled) speechSynthesis.cancel();}} style={{
                  background:ttsEnabled?"#f97316":"#1b2838",
                  border:"none",color:ttsEnabled?"#080c14":"#3b5068",borderRadius:6,
                  padding:"3px 8px",fontSize:10,cursor:"pointer",
                  fontFamily:"Outfit",fontWeight:700
                }}>
                  {ttsEnabled ? "🔊" : "🔇"}
                </button>
              )}
              {/* Voice selector */}
              {ttsSupported && availableVoices.length > 0 && (
                <select
                  value={ttsVoice?.name || ''}
                  onChange={e => setTtsVoice(availableVoices.find(v => v.name === e.target.value))}
                  style={{
                    background:"#111927",border:"1px solid #1b2838",color:"#3b5068",
                    borderRadius:4,padding:"2px 4px",fontSize:8,fontFamily:"IBM Plex Mono",
                    maxWidth:90,outline:"none"
                  }}>
                  {availableVoices.filter(v => v.lang.startsWith('ro') || v.lang.startsWith('en')).slice(0, 12).map(v => (
                    <option key={v.name} value={v.name}>{v.name.replace(/^(Microsoft |Google )/,'').slice(0,18)}</option>
                  ))}
                </select>
              )}
              {/* Clear chat */}
              <button onClick={()=>{setAgentMessages([]);setAgentHistory([]);}} style={{
                background:"#1b2838",border:"none",color:"#3b5068",borderRadius:6,
                padding:"3px 8px",fontSize:9,cursor:"pointer",fontFamily:"IBM Plex Mono"
              }}>CLR</button>
            </div>
          </div>

          {/* Chat messages */}
          <div ref={agentLogRef} style={{
            padding:"8px 12px",maxHeight:280,overflowY:"auto",minHeight:80,
            display:"flex",flexDirection:"column",gap:6
          }}>
            {agentMessages.length === 0 && (
              <div style={{textAlign:"center",padding:"20px 0",color:"#2a3f55",fontSize:11}}>
                {sttSupported ? "Apasă 🎤 și vorbește sau scrie un mesaj" : "Scrie un mesaj pentru IRIS"}
              </div>
            )}
            {agentMessages.map((msg, i) => {
              if (msg.role === 'user') {
                return (
                  <div key={i} style={{alignSelf:"flex-end",maxWidth:"85%"}}>
                    <div style={{background:"#1e3a5f",borderRadius:"12px 12px 4px 12px",padding:"8px 12px",
                      fontSize:12,color:"#c8d6e5",fontFamily:"IBM Plex Mono"}}>
                      {msg.text}
                    </div>
                    <div style={{fontSize:8,color:"#2a3f55",textAlign:"right",marginTop:2}}>{msg.time}</div>
                  </div>
                );
              }
              if (msg.role === 'iris') {
                return (
                  <div key={i} style={{alignSelf:"flex-start",maxWidth:"85%"}}>
                    <div style={{background:"linear-gradient(135deg,#1a0f00,#2d1800)",border:"1px solid #3d2200",
                      borderRadius:"12px 12px 12px 4px",padding:"8px 12px",
                      fontSize:12,color:"#fbbf24",fontFamily:"IBM Plex Mono"}}>
                      <span style={{fontSize:9,fontWeight:700,color:"#f97316",display:"block",marginBottom:3}}>IRIS</span>
                      {msg.text}
                    </div>
                    <div style={{fontSize:8,color:"#2a3f55",marginTop:2}}>{msg.time}</div>
                  </div>
                );
              }
              if (msg.role === 'thinking') {
                return (
                  <div key={i} style={{fontSize:10,color:"#f97316",fontStyle:"italic",padding:"2px 8px",
                    borderLeft:"2px solid #f97316",background:"#1a0f00",borderRadius:4}}>
                    💭 {msg.text}
                  </div>
                );
              }
              if (msg.role === 'action') {
                return (
                  <div key={i} style={{fontSize:10,fontFamily:"IBM Plex Mono",padding:"4px 8px",
                    background:"#0d1a0d",borderLeft:"2px solid #10b981",borderRadius:4}}>
                    <span style={{color:"#10b981",fontWeight:700}}>⚡ {msg.name}</span>
                    <span style={{color:"#3b5068"}}>(</span>
                    <span style={{color:"#c8d6e5",fontSize:9}}>{JSON.stringify(msg.args)}</span>
                    <span style={{color:"#3b5068"}}>)</span>
                  </div>
                );
              }
              if (msg.role === 'action_result') {
                const ok = msg.result?.success !== false;
                return (
                  <div key={i} style={{fontSize:9,fontFamily:"IBM Plex Mono",padding:"3px 8px",
                    color:ok?"#10b981":"#ef4444",borderLeft:`2px solid ${ok?"#10b981":"#ef4444"}`,
                    background:ok?"#0a1a0a":"#1a0a0a",borderRadius:4}}>
                    {ok ? "✓" : "✗"} {msg.name}: {JSON.stringify(msg.result).slice(0, 100)}
                  </div>
                );
              }
              if (msg.role === 'error') {
                return (
                  <div key={i} style={{fontSize:10,color:"#ef4444",padding:"4px 8px",
                    background:"#1a0a0a",borderRadius:4,borderLeft:"2px solid #ef4444"}}>
                    ❌ {msg.text}
                  </div>
                );
              }
              return null;
            })}
            {agentLoading && (
              <div style={{fontSize:11,color:"#f97316",padding:"4px 0"}}>
                <span style={{animation:"pulse 1s infinite"}}>●</span> IRIS gândește...
              </div>
            )}
          </div>

          {/* Input bar with mic button */}
          <div style={{padding:"8px 12px",borderTop:"1px solid #1b2838",display:"flex",gap:6,alignItems:"center"}}>
            {/* Microphone button */}
            {sttSupported && (
              <button onClick={toggleListening} 
                disabled={agentLoading}
                style={{
                  width:38,height:38,borderRadius:"50%",border:"none",cursor:agentLoading?"not-allowed":"pointer",
                  background:isListening?"#ef4444":"linear-gradient(135deg,#f97316,#ea580c)",
                  color:"#fff",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",
                  boxShadow:isListening?"0 0 16px rgba(239,68,68,0.5)":"0 0 8px rgba(249,115,22,0.3)",
                  transition:"all 0.2s",flexShrink:0,
                  animation:isListening?"pulse 1s infinite":"none"
                }}>
                {isListening ? "⏹" : "🎤"}
              </button>
            )}
            <input type="text" value={agentInput}
              onChange={e => setAgentInput(e.target.value)}
              onKeyDown={e => { if(e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendAgentMessage(); }}}
              placeholder={isListening ? "Ascult..." : "Vorbește cu IRIS..."}
              disabled={agentLoading}
              style={{
                flex:1,background:"#111927",border:`1px solid ${isListening?"#f97316":"#1b2838"}`,
                color:"#c8d6e5",borderRadius:10,padding:"9px 14px",fontSize:12,
                fontFamily:"IBM Plex Mono",outline:"none",transition:"border-color 0.3s"
              }}/>
            <button onClick={sendAgentMessage}
              disabled={agentLoading || !agentInput.trim()}
              style={{
                background:agentLoading?"#1b2838":(agentInput.trim()?"linear-gradient(135deg,#f97316,#ea580c)":"#1b2838"),
                border:"none",color:agentInput.trim()?"#fff":"#3b5068",borderRadius:10,
                padding:"9px 16px",fontSize:11,cursor:agentLoading?"not-allowed":"pointer",
                fontFamily:"Outfit",fontWeight:700,letterSpacing:0.5,flexShrink:0,
                transition:"all 0.2s"
              }}>
              {agentLoading ? "..." : "SEND"}
            </button>
          </div>
        </div>
      </div>

      {/* ─── CONTROLS PANEL ─── */}
      <div style={{flex:"0 0 310px",display:"flex",flexDirection:"column",gap:12,maxHeight:"100vh",overflowY:"auto"}}>
        
        {/* ESP32 Connection */}
        <div style={{background:"#0d1117",borderRadius:16,border:`1px solid ${connected?"#10b981":"#1b2838"}`,padding:14,transition:"border-color 0.3s"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
            <div style={{width:10,height:10,borderRadius:"50%",background:connected?"#10b981":"#ef4444",boxShadow:connected?"0 0 8px #10b981":"0 0 8px #ef4444"}}/>
            <span style={{fontFamily:"Outfit",fontSize:13,fontWeight:700,color:connected?"#10b981":"#ef4444",letterSpacing:1}}>
              {connected ? "ESP32 CONNECTED" : "ESP32 OFFLINE"}
            </span>
          </div>
          {connected && (
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>setLiveMode(l=>!l)} style={{
                flex:1,background:liveMode?"#10b981":"#1b2838",border:"1px solid "+(liveMode?"#10b981":"#2a3f55"),
                color:liveMode?"#080c14":"#3b5068",borderRadius:8,padding:"8px 10px",fontSize:11,
                cursor:"pointer",fontFamily:"Outfit",fontWeight:700,letterSpacing:0.5,transition:"all 0.2s"
              }}>
                {liveMode ? "● LIVE" : "○ LIVE OFF"}
              </button>
              <button onClick={pushToRobot} style={{
                flex:1,background:"#1b2838",border:"1px solid #2a3f55",color:"#0ea5e9",borderRadius:8,
                padding:"8px 10px",fontSize:11,cursor:"pointer",fontFamily:"Outfit",fontWeight:700,
                letterSpacing:0.5,transition:"all 0.2s"
              }}
              onMouseEnter={e=>{e.target.style.background="#0ea5e9";e.target.style.color="#080c14"}}
              onMouseLeave={e=>{e.target.style.background="#1b2838";e.target.style.color="#0ea5e9"}}
              >PUSH ALL</button>
            </div>
          )}
          {!connected && (
            <div style={{fontSize:10,color:"#2a3f55",lineHeight:1.5}}>
              Run: <span style={{color:"#3b5068"}}>python3 iris_bridge.py</span>
            </div>
          )}
        </div>

        {/* PS4 Manual Control */}
        <div style={{background:"#0d1117",borderRadius:16,border:`1px solid ${gamepadRunning?"#8b5cf6":"#1b2838"}`,padding:14,transition:"border-color 0.3s"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
            <div style={{width:10,height:10,borderRadius:"50%",background:gamepadRunning?"#8b5cf6":"#3b5068",boxShadow:gamepadRunning?"0 0 8px #8b5cf6":"none"}}/>
            <span style={{fontFamily:"Outfit",fontSize:13,fontWeight:700,color:gamepadRunning?"#c4b5fd":"#3b5068",letterSpacing:1}}>
              {gamepadRunning ? "PS4 CONTROL ON" : "PS4 CONTROL"}
            </span>
          </div>
          <button onClick={toggleGamepad} disabled={!connected} style={{
            width:"100%",
            background:gamepadRunning?"#8b5cf6":connected?"#1b2838":"#111927",
            border:`1px solid ${gamepadRunning?"#8b5cf6":"#2a3f55"}`,
            color:gamepadRunning?"#080c14":connected?"#c4b5fd":"#2a3f55",
            borderRadius:8,padding:"9px 12px",fontSize:11,
            cursor:connected?"pointer":"not-allowed",fontFamily:"Outfit",fontWeight:700,
            letterSpacing:0.8,transition:"all 0.2s"
          }}>
            {gamepadRunning ? "STOP CONTROLLER" : "START CONTROLLER"}
          </button>
          <div style={{fontSize:9,color:"#3b5068",lineHeight:1.6,marginTop:9}}>
            R1 open · L1 close · R2/L2 CH1<br/>
            RS Y/X CH3/CH2 · LS X inv/Y CH6/CH4
          </div>
          {gamepadStatus && gamepadStatus.pid && (
            <div style={{fontSize:9,color:"#2a3f55",marginTop:6}}>pid {gamepadStatus.pid}</div>
          )}
        </div>

        {/* Hello Wave */}
        <div style={{background:"#0d1117",borderRadius:16,border:`1px solid ${helloRunning?"#f97316":"#1b2838"}`,padding:14,transition:"border-color 0.3s"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
            <div style={{width:10,height:10,borderRadius:"50%",background:helloRunning?"#f97316":"#3b5068",boxShadow:helloRunning?"0 0 8px #f97316":"none"}}/>
            <span style={{fontFamily:"Outfit",fontSize:13,fontWeight:700,color:helloRunning?"#fed7aa":"#3b5068",letterSpacing:1}}>
              {helloRunning ? "HELLO RUNNING" : "AUDIENCE HELLO"}
            </span>
          </div>
          <button onClick={runHelloWave} disabled={!connected || helloRunning} style={{
            width:"100%",
            background:helloRunning?"#3b2a1a":connected?"linear-gradient(135deg,#f97316,#ea580c)":"#111927",
            border:`1px solid ${helloRunning?"#f97316":connected?"#f97316":"#2a3f55"}`,
            color:connected && !helloRunning ? "#080c14" : "#3b5068",
            borderRadius:8,padding:"9px 12px",fontSize:11,
            cursor:connected && !helloRunning ? "pointer":"not-allowed",fontFamily:"Outfit",fontWeight:700,
            letterSpacing:0.8,transition:"all 0.2s"
          }}>
            {helloRunning ? "WAVING..." : "HELLO"}
          </button>
          <div style={{fontSize:9,color:"#3b5068",lineHeight:1.6,marginTop:9}}>
            3x CH6 127° ↔ 33° · CH1 wrist wave
          </div>
        </div>

        {/* Dance Routine */}
        <div style={{background:"#0d1117",borderRadius:16,border:`1px solid ${danceRunning?"#22c55e":"#1b2838"}`,padding:14,transition:"border-color 0.3s"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
            <div style={{width:10,height:10,borderRadius:"50%",background:danceRunning?"#22c55e":"#3b5068",boxShadow:danceRunning?"0 0 8px #22c55e":"none"}}/>
            <span style={{fontFamily:"Outfit",fontSize:13,fontWeight:700,color:danceRunning?"#bbf7d0":"#3b5068",letterSpacing:1}}>
              {danceRunning ? "DANCE RUNNING" : "MUSIC DANCE"}
            </span>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={danceRunning ? stopDance : startDance} disabled={!connected} style={{
              flex:1,
              background:danceRunning?"#ef4444":connected?"linear-gradient(135deg,#22c55e,#16a34a)":"#111927",
              border:`1px solid ${danceRunning?"#ef4444":connected?"#22c55e":"#2a3f55"}`,
              color:connected ? "#080c14" : "#2a3f55",
              borderRadius:8,padding:"9px 12px",fontSize:11,
              cursor:connected?"pointer":"not-allowed",fontFamily:"Outfit",fontWeight:700,
              letterSpacing:0.8,transition:"all 0.2s"
            }}>
              {danceRunning ? "STOP DANCE" : "DANCE 30S"}
            </button>
          </div>
          <div style={{fontSize:9,color:"#3b5068",lineHeight:1.6,marginTop:9}}>
            30s MP3 · speed 2.0-2.25 · CH2 + gripper hits
          </div>
          {danceAudioSrc && (
            <audio
              key={danceAudioSrc}
              src={danceAudioSrc}
              autoPlay
              controls
              preload="auto"
              width="100%"
              style={{width:"100%",marginTop:10,accentColor:"#22c55e"}}
            />
          )}
        </div>

        {/* Servo Sliders */}
        <div style={{background:"#0d1117",borderRadius:16,border:"1px solid #1b2838",padding:18}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <span style={{fontFamily:"Outfit",fontSize:14,fontWeight:700,color:"#0ea5e9",letterSpacing:1}}>SERVO CONTROL</span>
            <button onClick={resetHome} style={{
              background:"#1b2838",border:"1px solid #2a3f55",color:"#3b5068",borderRadius:6,
              padding:"5px 12px",fontSize:10,cursor:"pointer",fontFamily:"IBM Plex Mono",fontWeight:600,
              transition:"all 0.2s"
            }}
            onMouseEnter={e=>{e.target.style.background="#2a3f55";e.target.style.color="#c8d6e5"}}
            onMouseLeave={e=>{e.target.style.background="#1b2838";e.target.style.color="#3b5068"}}
            >HOME</button>
          </div>

          {/* Connection + Live controls */}
          <div style={{display:"flex",gap:8,marginBottom:14,alignItems:"center"}}>
            <div style={{width:8,height:8,borderRadius:"50%",background:connected?"#10b981":"#ef4444",boxShadow:connected?"0 0 6px #10b981":"0 0 6px #ef4444",flexShrink:0}}/>
            <span style={{fontSize:10,color:connected?"#10b981":"#ef4444",flexShrink:0}}>
              {connected?"SERIAL OK":"OFFLINE"}
            </span>
            <div style={{flex:1}}/>
            <button onClick={()=>setLiveMode(l=>!l)} style={{
              background:liveMode?"#10b981":"#1b2838",border:"1px solid "+(liveMode?"#10b981":"#2a3f55"),
              color:liveMode?"#080c14":"#3b5068",borderRadius:6,padding:"4px 10px",fontSize:10,
              cursor:"pointer",fontFamily:"IBM Plex Mono",fontWeight:700,transition:"all 0.2s"
            }}>
              {liveMode ? "● LIVE" : "○ LIVE"}
            </button>
            <button onClick={pushToRobot} style={{
              background:"#1b2838",border:"1px solid #2a3f55",color:"#0ea5e9",borderRadius:6,
              padding:"4px 10px",fontSize:10,cursor:"pointer",fontFamily:"IBM Plex Mono",fontWeight:700,
              transition:"all 0.2s"
            }}>PUSH</button>
          </div>

          {/* Speed control */}
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14,padding:"6px 0"}}>
            <span style={{fontSize:9,color:"#2a3f55",flexShrink:0}}>🐢</span>
            <input type="range" min={1} max={10} defaultValue={1} style={{flex:1,accentColor:"#f59e0b",height:3}}
              onChange={e => {
                fetch(BRIDGE_URL + "/speed?step=" + e.target.value + "&delay=15").catch(()=>{});
              }}/>
            <span style={{fontSize:9,color:"#2a3f55",flexShrink:0}}>🐇</span>
            <span style={{fontSize:9,color:"#3b5068",width:50,textAlign:"right"}}>SPEED</span>
          </div>

          {SERVO_LIST.filter(s => !s.isGripper).map(s => (
            <div key={s.key} style={{marginBottom:12}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:3}}>
                <span style={{color:"#3b5068"}}>
                  <span style={{color:s.color,fontWeight:700}}>CH{s.ch}</span> {s.label}
                </span>
                <span style={{color:"#c8d6e5",fontWeight:600,fontSize:13}}>{servoDeg[s.key]}°</span>
              </div>
              <input type="range" min={s.min} max={s.max} value={servoDeg[s.key]}
                onChange={e => handleServo(s.key, e.target.value)}
                style={{width:"100%",accentColor:s.color,height:4}}/>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:8,color:"#1b2838",marginTop:1}}>
                <span>{s.min}°</span>
                <span style={{color:"#2a3f55"}}>offset {s.offset}°</span>
                <span>{s.max}°</span>
              </div>
            </div>
          ))}

          {/* CH0 Gripper — OPEN/CLOSE toggle only */}
          <div style={{background:"#111927",borderRadius:8,padding:"10px 12px",marginTop:4,marginBottom:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontSize:11,color:"#3b5068"}}>
                <span style={{color:"#ef4444",fontWeight:700}}>CH0</span> Gripper
              </span>
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                <button onClick={toggleGripper} style={{
                  background: gripperOpen ? "#10b981" : "#ef4444",
                  border:"none", borderRadius:6, padding:"5px 16px",
                  color:"#080c14", fontSize:11, fontWeight:700,
                  cursor:"pointer", fontFamily:"IBM Plex Mono",
                  letterSpacing:1, transition:"all 0.15s"
                }}>
                  {gripperOpen ? "✋ OPEN" : "✊ CLOSED"}
                </button>
                <span style={{color:"#c8d6e5",fontWeight:600,fontSize:13,minWidth:30,textAlign:"right"}}>
                  {gripperOpen ? "0°" : "70°"}
                </span>
              </div>
            </div>
          </div>

          {/* CH5 Shoulder B */}
          <div style={{background:"#111927",borderRadius:8,padding:"10px 12px",marginTop:4}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
              <span style={{fontSize:11,color:"#3b5068"}}>
                <span style={{color:"#0ea5e9",fontWeight:700}}>CH5</span> Shoulder B
              </span>
              <div style={{display:"flex",gap:4}}>
                <button onClick={()=>setCh5Manual(false)} style={{
                  background:!ch5Manual?"#0ea5e9":"#1b2838",border:"none",
                  color:!ch5Manual?"#080c14":"#3b5068",borderRadius:4,padding:"2px 8px",
                  fontSize:9,cursor:"pointer",fontFamily:"IBM Plex Mono",fontWeight:700
                }}>MIRROR</button>
                <button onClick={()=>setCh5Manual(true)} style={{
                  background:ch5Manual?"#f59e0b":"#1b2838",border:"none",
                  color:ch5Manual?"#080c14":"#3b5068",borderRadius:4,padding:"2px 8px",
                  fontSize:9,cursor:"pointer",fontFamily:"IBM Plex Mono",fontWeight:700
                }}>MANUAL</button>
              </div>
              <span style={{color:"#c8d6e5",fontWeight:600,fontSize:13}}>{ch5Manual ? ch5Value : 180-servoDeg.shoulder}°</span>
            </div>
            {ch5Manual && (
              <div>
                <input type="range" min={0} max={180} value={ch5Value}
                  onChange={e => {
                    const v = Number(e.target.value);
                    setCh5Value(v);
                    if (liveMode && connected) {
                      fetch(`${BRIDGE_URL}/servo?ch=5&angle=${v}`).catch(()=>{});
                    }
                  }}
                  style={{width:"100%",accentColor:"#f59e0b",height:3}}/>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:8,color:"#1b2838"}}>
                  <span>0°</span><span>180°</span>
                </div>
              </div>
            )}
          </div>
        </div>

        {/* End Effector */}
        <div style={{background:"#0d1117",borderRadius:16,border:"1px solid #1b2838",padding:18}}>
          <span style={{fontFamily:"Outfit",fontSize:14,fontWeight:700,color:"#0ea5e9",letterSpacing:1,display:"block",marginBottom:10}}>END EFFECTOR</span>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
            {[["X",ee.x,"#ef4444"],["Y",ee.y,"#22c55e"],["Z",ee.z,"#3b82f6"]].map(([ax,val,col]) => (
              <div key={ax} style={{textAlign:"center",background:"#111927",borderRadius:10,padding:"10px 4px",border:"1px solid #1b2838"}}>
                <div style={{fontSize:10,color:col,fontWeight:700}}>{ax}</div>
                <div style={{fontSize:16,fontWeight:700,color:"#c8d6e5",margin:"2px 0"}}>{val.toFixed(1)}</div>
                <div style={{fontSize:8,color:"#2a3f55"}}>mm</div>
              </div>
            ))}
          </div>
          <div style={{marginTop:8,textAlign:"center",background:"#111927",borderRadius:10,padding:"8px 4px",border:"1px solid #1b2838"}}>
            <span style={{fontSize:10,color:"#3b5068"}}>Reach </span>
            <span style={{fontSize:15,fontWeight:700,color:"#fbbf24"}}>{Math.sqrt(ee.x**2+ee.y**2+ee.z**2).toFixed(1)}</span>
            <span style={{fontSize:9,color:"#3b5068"}}> mm</span>
          </div>
        </div>

        {/* IK Solver */}
        <div style={{background:"#0d1117",borderRadius:16,border:"1px solid #1b2838",padding:18}}>
          <span style={{fontFamily:"Outfit",fontSize:14,fontWeight:700,color:"#fbbf24",letterSpacing:1,display:"block",marginBottom:10}}>IK SOLVER</span>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {[["X",ikTarget.x,"x"],["Y",ikTarget.y,"y"],["Z",ikTarget.z,"z"]].map(([label,val,k]) => (
              <div key={k} style={{display:"flex",alignItems:"center",gap:8}}>
                <label style={{fontSize:11,color:"#3b5068",width:20,fontWeight:700}}>{label}</label>
                <input type="number" value={val}
                  onChange={e => setIkTarget(p => ({...p,[k]:Number(e.target.value)}))}
                  style={{
                    background:"#111927",border:"1px solid #1b2838",color:"#c8d6e5",
                    borderRadius:8,padding:"6px 10px",fontSize:12,fontFamily:"IBM Plex Mono",
                    width:90,outline:"none"
                  }}/>
                <span style={{fontSize:9,color:"#2a3f55"}}>mm</span>
              </div>
            ))}
          </div>
          <button onClick={runIK} style={{
            background:"linear-gradient(135deg,#0ea5e9,#0284c7)",border:"none",color:"#080c14",
            borderRadius:10,padding:"10px 16px",fontSize:12,cursor:"pointer",fontFamily:"Outfit",
            fontWeight:700,width:"100%",marginTop:12,letterSpacing:1,transition:"transform 0.15s"
          }}
          onMouseEnter={e=>e.target.style.transform="scale(1.02)"}
          onMouseLeave={e=>e.target.style.transform="scale(1)"}
          >SOLVE IK</button>
          {ikError !== null && (
            <div style={{fontSize:10,color:ikError<5?"#10b981":"#f59e0b",marginTop:8,textAlign:"center"}}>
              Error: {ikError.toFixed(2)} mm {ikError<5?"✓":"⚠ may be out of reach"}
            </div>
          )}
        </div>

        {/* Demo Mode */}
        <div style={{background:"#0d1117",borderRadius:16,border:`1px solid ${demoRunning?"#f43f5e":"#1b2838"}`,padding:18,transition:"border-color 0.3s"}}>
          <span style={{fontFamily:"Outfit",fontSize:14,fontWeight:700,color:"#f43f5e",letterSpacing:1,display:"block",marginBottom:10}}>
            {demoRunning ? "● DEMO RUNNING" : "DEMO MODE"}
          </span>

          {/* Mode tabs */}
          <div style={{display:"flex",gap:6,marginBottom:10}}>
            {[
              {k:"random",  label:"RANDOM"},
              {k:"pattern", label:"PATTERN"},
            ].map(t => (
              <button key={t.k}
                onClick={() => !demoRunning && setDemoMode(t.k)}
                disabled={demoRunning}
                style={{
                  flex:1,
                  background: demoMode===t.k ? "#1b2838" : "#0d1117",
                  border:`1px solid ${demoMode===t.k ? "#f43f5e" : "#1b2838"}`,
                  color: demoMode===t.k ? "#f43f5e" : "#3b5068",
                  borderRadius:8,padding:"6px 10px",fontSize:10,
                  fontFamily:"Outfit",fontWeight:700,letterSpacing:1,
                  cursor: demoRunning ? "not-allowed" : "pointer",
                  transition:"all 0.2s"
                }}>
                {t.label}
              </button>
            ))}
          </div>

          {demoMode === "pattern" && (
            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:10}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:9,color:"#2a3f55",width:42}}>SHAPE</span>
                <select value={demoPattern}
                  onChange={e => !demoRunning && setDemoPattern(e.target.value)}
                  disabled={demoRunning}
                  style={{
                    flex:1,background:"#111927",color:"#c8d6e5",
                    border:"1px solid #1b2838",borderRadius:8,padding:"6px 8px",
                    fontSize:11,fontFamily:"Outfit",cursor: demoRunning ? "not-allowed" : "pointer"
                  }}>
                  {Object.entries(PATTERN_INFO).map(([k,v]) => (
                    <option key={k} value={k}>{v.label}</option>
                  ))}
                </select>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:9,color:"#2a3f55",width:42}}>Z (mm)</span>
                <input type="range" min={10} max={200} step={5} value={demoZ}
                  onChange={e => setDemoZ(Number(e.target.value))}
                  style={{flex:1,accentColor:"#f43f5e",height:3}}/>
                <span style={{fontSize:10,color:"#3b5068",width:35,textAlign:"right"}}>{demoZ}</span>
              </div>
            </div>
          )}

          <div style={{display:"flex",gap:8,marginBottom:10}}>
            <button onClick={demoRunning ? stopDemo : startDemo}
              disabled={!connected}
              style={{
                flex:1,
                background:demoRunning?"#f43f5e":connected?"linear-gradient(135deg,#f43f5e,#e11d48)":"#1b2838",
                border:"none",color:demoRunning?"#fff":connected?"#080c14":"#3b5068",borderRadius:10,
                padding:"10px 16px",fontSize:12,cursor:connected?"pointer":"not-allowed",
                fontFamily:"Outfit",fontWeight:700,letterSpacing:1,transition:"all 0.2s"
              }}>
              {demoRunning ? "■ STOP" : "▶ START"}
            </button>
          </div>

          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
            <span style={{fontSize:9,color:"#2a3f55"}}>SLOW</span>
            <input type="range" min={500} max={5000} step={250} value={demoSpeed}
              onChange={e => setDemoSpeed(Number(e.target.value))}
              style={{flex:1,accentColor:"#f43f5e",height:3}}/>
            <span style={{fontSize:9,color:"#2a3f55"}}>FAST</span>
            <span style={{fontSize:10,color:"#3b5068",width:35,textAlign:"right"}}>
              {demoMode === "pattern" ? `${(cycleMsForPattern()/1000).toFixed(1)}s/cycle` : `${(demoSpeed/1000).toFixed(1)}s`}
            </span>
          </div>

          {!connected && (
            <div style={{fontSize:10,color:"#2a3f55",textAlign:"center"}}>Bridge required</div>
          )}

          {demoLog.length > 0 && (
            <div style={{background:"#111927",borderRadius:8,padding:8,maxHeight:130,overflowY:"auto",marginTop:6}}>
              {demoLog.map((log, i) => (
                <div key={i} style={{fontSize:9,color:"#3b5068",fontFamily:"IBM Plex Mono",lineHeight:1.6,display:"flex",justifyContent:"space-between"}}>
                  <span>
                    <span style={{color:"#f43f5e"}}>#{log.step}</span> → ({log.x}, {log.y}, {log.z})
                  </span>
                  <span style={{color:log.err<5?"#10b981":"#f59e0b"}}>{log.err}mm</span>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* ESP32 Output */}
        <div style={{background:"#0d1117",borderRadius:16,border:"1px solid #1b2838",padding:18}}>
          <span style={{fontFamily:"Outfit",fontSize:14,fontWeight:700,color:"#10b981",letterSpacing:1,display:"block",marginBottom:10}}>ESP32 OUTPUT</span>
          <div style={{background:"#111927",borderRadius:8,padding:10,fontFamily:"IBM Plex Mono",fontSize:11,color:"#3b5068",lineHeight:1.8}}>
            <div><span style={{color:"#10b981"}}>pca.</span>setPWM(<span style={{color:"#fbbf24"}}>6</span>, <span style={{color:"#c8d6e5"}}>{servoDeg.base}</span>); <span style={{color:"#1b2838"}}>// base</span></div>
            <div><span style={{color:"#10b981"}}>pca.</span>setPWM(<span style={{color:"#fbbf24"}}>4</span>, <span style={{color:"#c8d6e5"}}>{servoDeg.shoulder}</span>); <span style={{color:"#1b2838"}}>// shoulder A</span></div>
            <div><span style={{color:"#10b981"}}>pca.</span>setPWM(<span style={{color:"#fbbf24"}}>5</span>, <span style={{color:"#c8d6e5"}}>{180-servoDeg.shoulder}</span>); <span style={{color:"#1b2838"}}>// shoulder B</span></div>
            <div><span style={{color:"#10b981"}}>pca.</span>setPWM(<span style={{color:"#fbbf24"}}>3</span>, <span style={{color:"#c8d6e5"}}>{servoDeg.elbow}</span>); <span style={{color:"#1b2838"}}>// elbow</span></div>
            <div><span style={{color:"#10b981"}}>pca.</span>setPWM(<span style={{color:"#fbbf24"}}>2</span>, <span style={{color:"#c8d6e5"}}>{servoDeg.wrist_pitch}</span>); <span style={{color:"#1b2838"}}>// wrist pitch</span></div>
            <div><span style={{color:"#10b981"}}>pca.</span>setPWM(<span style={{color:"#fbbf24"}}>1</span>, <span style={{color:"#c8d6e5"}}>{servoDeg.wrist_roll}</span>); <span style={{color:"#1b2838"}}>// wrist roll</span></div>
            <div><span style={{color:"#10b981"}}>pca.</span>setPWM(<span style={{color:"#fbbf24"}}>0</span>, <span style={{color:"#c8d6e5"}}>{servoDeg.gripper}</span>); <span style={{color:"#1b2838"}}>// gripper</span></div>
          </div>
        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
